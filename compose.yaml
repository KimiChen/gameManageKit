name: game-manage-kit-local

x-smoke-environment: &smoke-environment
  NODE_ENV: development
  GAME_MANAGE_KIT_MYSQL_URL: mysql://root@mysql:3306/game_manage_kit
  GAME_MANAGE_KIT_ADMIN_ORIGIN: http://app:2571
  GAME_MANAGE_KIT_LOG_ENABLED: "0"
  AUTH_DEV_ENABLED: "1"

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: game_manage_kit
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:3316:3306"
    volumes:
      - game_manage_kit_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  migrate:
    profiles: ["smoke"]
    image: game-manage-kit:smoke
    environment: *smoke-environment
    depends_on:
      mysql:
        condition: service_healthy
    command: ["node", "dist/migrate.js"]

  app:
    profiles: ["smoke"]
    image: game-manage-kit:smoke
    build: .
    environment: *smoke-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:12570:2570"

  smoke:
    profiles: ["smoke"]
    image: game-manage-kit:smoke
    environment:
      <<: *smoke-environment
      SMOKE_PUBLIC_URL: http://app:2570
      SMOKE_INTERNAL_URL: http://app:2571
    depends_on:
      app:
        condition: service_healthy
    command: ["node", "scripts/docker-smoke.mjs"]

volumes:
  game_manage_kit_mysql:
