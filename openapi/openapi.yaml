openapi: 3.1.0
info:
  title: gameManageKit API
  version: 2.0.0
  description: 多游戏、HTTP-only、MySQL-only 的账号门户服务。
servers:
  - url: https://portal.example.com
    description: Public
  - url: http://game-manage-kit.internal:2571
    description: Internal
tags:
  - name: Public
  - name: Internal
  - name: Admin
  - name: System
paths:
  /v1/admin/auth/login:
    post:
      operationId: adminLogin
      tags: [Admin]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '204':
          description: 登录成功；会话仅通过 HttpOnly Cookie 返回
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/admin/auth/session:
    get:
      operationId: getAdminSession
      tags: [Admin]
      security:
        - AdminSession: []
      responses:
        '200':
          description: 当前管理员及实时游戏权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionResponse'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      operationId: adminLogout
      tags: [Admin]
      security:
        - AdminSession: []
      responses:
        '204':
          description: 会话已撤销并清除 Cookie
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/admin/auth/reauthenticate:
    post:
      operationId: adminReauthenticate
      description: 验证当前管理员密码并提升现有 HttpOnly Cookie 会话；必须校验请求 Origin，且不签发独立高权限令牌。
      tags: [Admin]
      security:
        - AdminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReauthenticateRequest'
      responses:
        '204':
          description: 当前管理员会话已短期提升
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/admin/games:
    get:
      operationId: listAdminGames
      tags: [Admin]
      security:
        - AdminSession: []
      responses:
        '200':
          description: 返回全部游戏项目及其配置状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameProjectListResponse'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: createAdminGame
      description: 创建草稿游戏项目；必须使用管理员 Cookie 会话，并校验请求 Origin。
      tags: [Admin]
      security:
        - AdminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameProjectRequest'
      responses:
        '201':
          description: 游戏项目已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameProject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/admin/games/{gameId}:
    parameters:
      - $ref: '#/components/parameters/GameId'
    patch:
      operationId: updateAdminGame
      description: 按 revision 编辑游戏项目；gameId 不可修改，且必须校验请求 Origin。
      tags: [Admin]
      security:
        - AdminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGameProjectRequest'
      responses:
        '200':
          description: 游戏项目已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameProject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/admin/games/{gameId}/directory-settings:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      operationId: getAdminGameDirectorySettings
      description: 返回游戏目录设置及用于目录级乐观锁的 revision。
      tags: [Admin]
      security:
        - AdminSession: []
      responses:
        '200':
          description: 游戏目录设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDirectorySettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      operationId: updateAdminGameDirectorySettings
      description: 按目录 revision 修改 isOps；必须校验请求 Origin。
      tags: [Admin]
      security:
        - AdminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGameDirectorySettingsRequest'
      responses:
        '200':
          description: 游戏目录设置已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDirectorySettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/admin/games/{gameId}/servers:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      operationId: listAdminGameServers
      description: 返回指定游戏的全部区服，包括尚未开放给客户端的区服。
      tags: [Admin]
      security:
        - AdminSession: []
      responses:
        '200':
          description: 游戏区服列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedGameServerListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: createAdminGameServer
      description: 为指定游戏新增区服；必须使用管理员 Cookie 会话，并校验请求 Origin。
      tags: [Admin]
      security:
        - AdminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameServerRequest'
      responses:
        '201':
          description: 游戏区服已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedGameServerMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/admin/games/{gameId}/servers/{serverId}:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/ServerId'
    patch:
      operationId: updateAdminGameServer
      description: 按 revision 编辑区服；gameId 与 serverId 不可修改，且必须校验请求 Origin。
      tags: [Admin]
      security:
        - AdminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGameServerRequest'
      responses:
        '200':
          description: 游戏区服已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedGameServerMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/admin/games/{gameId}/integration:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      operationId: getAdminGameIntegration
      description: 返回游戏接入参数、运行时加载 revision 和微信 Secret 元数据；永不返回 Secret 或摘要。
      tags: [Admin]
      security:
        - AdminSession: []
      responses:
        '200':
          description: 游戏接入配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameIntegration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      operationId: updateAdminGameIntegration
      description: 按 revision 修改不含 Secret 的接入参数；必须校验请求 Origin。
      tags: [Admin]
      security:
        - AdminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGameIntegrationRequest'
      responses:
        '200':
          description: 游戏接入配置已保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameIntegration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/admin/games/{gameId}/secrets/wechat-app-secret:
    parameters:
      - $ref: '#/components/parameters/GameId'
    put:
      operationId: replaceAdminWechatAppSecret
      description: 替换微信 AppSecret；要求 Secret 权限、最近重新认证、Origin、revision 和幂等 operationId。
      tags: [Admin]
      security:
        - AdminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceWechatAppSecretRequest'
      responses:
        '200':
          description: 微信 AppSecret 已保存；响应不回显明文
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WechatSecretWriteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/admin/machine-identities:
    get:
      operationId: listAdminMachineIdentities
      description: 返回 Service 与机器 Admin 身份、游戏范围和 Secret 版本元数据；永不返回摘要。
      tags: [Admin]
      security:
        - AdminSession: []
      responses:
        '200':
          description: 机器身份列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineIdentityListResponse'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: createAdminMachineIdentity
      description: 创建机器身份并生成一次性 Secret；要求机器身份和 Secret 权限、最近重新认证与 Origin。
      tags: [Admin]
      security:
        - AdminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMachineIdentityRequest'
      responses:
        '201':
          description: 身份已创建；首次响应含一次性 Secret，幂等重放不再返回 Secret
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineSecretIssuedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/admin/machine-identities/{identityId}:
    parameters:
      - $ref: '#/components/parameters/IdentityId'
    patch:
      operationId: updateAdminMachineIdentity
      description: 按 revision 修改机器身份；游戏范围变化要求最近重新认证，且必须校验 Origin。
      tags: [Admin]
      security:
        - AdminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMachineIdentityRequest'
      responses:
        '200':
          description: 机器身份已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineIdentity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/admin/machine-identities/{identityId}/secret-rotations:
    parameters:
      - $ref: '#/components/parameters/IdentityId'
    post:
      operationId: rotateAdminMachineSecret
      description: 生成新 current Secret，并让旧 current 在明确窗口内成为 previous；必须校验 Origin。
      tags: [Admin]
      security:
        - AdminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateMachineSecretRequest'
      responses:
        '200':
          description: Secret 已轮换；首次响应含一次性 Secret，幂等重放不再返回 Secret
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineSecretIssuedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/admin/machine-identities/{identityId}/secret-versions/{version}/revoke:
    parameters:
      - $ref: '#/components/parameters/IdentityId'
      - $ref: '#/components/parameters/SecretVersion'
    post:
      operationId: revokeAdminMachineSecret
      description: 撤销 current 或 previous Secret；要求 Secret 权限、最近重新认证与 Origin。
      tags: [Admin]
      security:
        - AdminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeMachineSecretRequest'
      responses:
        '200':
          description: Secret 版本已撤销
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineSecretRevokedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/admin/machine-identities/{identityId}/secret-rotations/{operationId}:
    parameters:
      - $ref: '#/components/parameters/IdentityId'
      - $ref: '#/components/parameters/OperationId'
    get:
      operationId: getAdminMachineSecretRotationStatus
      description: 查询未知结果的 Secret 操作状态；只返回元数据，永不恢复一次性 Secret。
      tags: [Admin]
      security:
        - AdminSession: []
      responses:
        '200':
          description: Secret 操作状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineSecretOperationStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/admin/config-audit:
    get:
      operationId: listAdminConfigAudit
      description: 返回最近的配置与 Secret 审计白名单元数据，不返回 Secret、摘要或通用 before/after JSON。
      tags: [Admin]
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/AuditGameId'
        - $ref: '#/components/parameters/AuditLimit'
      responses:
        '200':
          description: 最近配置审计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationAuditPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/games:
    get:
      operationId: listClientGames
      description: 返回允许客户端发现的游戏；仅包含 enabled 或 maintenance 状态。
      tags: [Public]
      security: []
      responses:
        '200':
          description: 客户端游戏列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientGameListResponse'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/games/{gameId}/sessions/wechat:
    parameters:
      - $ref: '#/components/parameters/GameId'
    post:
      operationId: wxLogin
      tags: [Public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WxLoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/games/{gameId}/sessions/dev:
    parameters:
      - $ref: '#/components/parameters/GameId'
    post:
      operationId: devLogin
      description: 仅 AUTH_DEV_ENABLED=1 时可用；生产环境固定返回 404。
      tags: [Public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevLoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
