openapi: 3.1.0
info:
  title: gameManageKit API
  version: 1.0.0
  description: 多游戏、HTTP-only、MySQL-only 的账号门户服务。
servers:
  - url: https://portal.example.com
    description: Public
  - url: http://game-manage-kit.internal:2571
    description: Internal
tags:
  - name: Public
  - name: Internal
  - name: Admin
  - name: System
paths:
  /v1/admin/auth/login:
    post:
      operationId: adminLogin
      tags: [Admin]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '204':
          description: 登录成功；会话仅通过 HttpOnly Cookie 返回
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/admin/auth/session:
    get:
      operationId: getAdminSession
      tags: [Admin]
      security:
        - AdminSession: []
      responses:
        '200':
          description: 当前管理员及实时游戏权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionResponse'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      operationId: adminLogout
      tags: [Admin]
      security:
        - AdminSession: []
      responses:
        '204':
          description: 会话已撤销并清除 Cookie
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/games/{gameId}/sessions/wechat:
    parameters:
      - $ref: '#/components/parameters/GameId'
    post:
      operationId: wxLogin
      tags: [Public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WxLoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/games/{gameId}/sessions/dev:
    parameters:
      - $ref: '#/components/parameters/GameId'
    post:
      operationId: devLogin
      description: 仅 AUTH_DEV_ENABLED=1 时可用；生产环境固定返回 404。
      tags: [Public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevLoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/games/{gameId}/areas:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      operationId: listAreas
      tags: [Public]
      security:
        - {}
        - UserBearer: []
      responses:
        '200':
          description: 选服目录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/games/{gameId}/internal/sessions/verify:
    parameters:
      - $ref: '#/components/parameters/GameId'
    post:
      operationId: verifySession
      tags: [Internal]
      security:
        - ServiceId: []
          ServiceSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifySessionRequest'
      responses:
        '200':
          description: 校验结果；身份失败也返回 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifySessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/ServiceUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/games/{gameId}/internal/characters/{userId}/{serverId}:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/ServerId'
    put:
      operationId: registerCharacter
      tags: [Internal]
      security:
        - ServiceId: []
          ServiceSecret: []
      responses:
        '200':
          description: 幂等登记成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterCharacterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/ServiceUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      operationId: hasCharacter
      tags: [Internal]
      security:
        - ServiceId: []
          ServiceSecret: []
      responses:
        '200':
          description: 是否存在角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HasCharacterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/ServiceUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/games/{gameId}/admin/accounts/{userId}/ban:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: banAccount
      tags: [Admin]
      security:
        - AdminSession: []
        - AdminSecret: []
          OperatorId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAccountRequest'
      responses:
        '200':
          description: 封号结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/games/{gameId}/admin/accounts/{userId}/revoke:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: revokeAccount
      tags: [Admin]
      security:
        - AdminSession: []
        - AdminSecret: []
          OperatorId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAccountRequest'
      responses:
        '200':
          description: 撤销该游戏账号的全部现有会话；账号保留且允许重新登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/games/{gameId}/admin/accounts/{userId}:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getAdminAccount
      tags: [Admin]
      security:
        - AdminSession: []
        - AdminSecret: []
          OperatorId: []
      responses:
        '200':
          description: 仅返回管理所需的最小账号摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccountDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /metrics:
    get:
      operationId: metrics
      tags: [Internal]
      security:
        - ServiceId: []
          ServiceSecret: []
      responses:
        '200':
          description: Prometheus 文本格式指标
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/ServiceUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
  /livez:
    get:
      operationId: livez
      tags: [System]
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveResponse'
  /readyz:
    get:
      operationId: readyz
      tags: [System]
      responses:
        '200':
          description: 依赖就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: 未就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /version:
    get:
      operationId: version
      tags: [System]
      responses:
        '200':
          description: 版本信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
components:
  securitySchemes:
    UserBearer:
      type: http
      scheme: bearer
    ServiceId:
      type: apiKey
      in: header
      name: x-service-id
    ServiceSecret:
      type: apiKey
      in: header
      name: x-service-secret
    AdminSecret:
      type: apiKey
      in: header
      name: x-admin-secret
    OperatorId:
      type: apiKey
      in: header
      name: x-operator-id
    AdminSession:
      type: apiKey
      in: cookie
      name: __Host-gmk_admin_session
  parameters:
    GameId:
      name: gameId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/GameId'
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 32
        pattern: '^u_[0-9]+$'
    ServerId:
      name: serverId
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
        maximum: 65535
  responses:
    BadRequest:
      description: 入参不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 用户身份无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnauthorized:
      description: 服务身份无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AdminUnauthorized:
      description: 管理员凭证或会话无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 禁止访问；可能为账号封禁、游戏停用、调用方无游戏权限或区服停用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源、游戏或区服不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 操作冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: 请求过频
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Internal:
      description: 内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unavailable:
      description: 微信上游不可用，或游戏处于维护状态
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    GameId:
      type: string
      minLength: 2
      maxLength: 32
      pattern: '^[a-z][a-z0-9-]{1,31}$'
    GameStatus:
      type: string
      enum: [enabled, maintenance, disabled]
    ErrorCode:
      type: string
      enum:
        - INVALID_PAYLOAD
        - AUTH_REQUIRED
        - ACCOUNT_BANNED
        - NOT_FOUND
        - RATE_LIMITED
        - UPSTREAM_UNAVAILABLE
        - SERVICE_AUTH_REQUIRED
        - SERVICE_FORBIDDEN
        - OPERATION_CONFLICT
        - INTERNAL
        - GAME_NOT_FOUND
        - GAME_DISABLED
        - GAME_ACCESS_DENIED
        - SERVER_NOT_FOUND
        - SERVER_DISABLED
        - ADMIN_AUTH_REQUIRED
        - ORIGIN_FORBIDDEN
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, requestId]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        requestId:
          type: string
    WxLoginRequest:
      type: object
      additionalProperties: false
      required: [code, serverId]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 128
        serverId:
          type: integer
          minimum: 0
          maximum: 65535
        deviceId:
          type:
            - string
            - 'null'
          maxLength: 64
    DevLoginRequest:
      type: object
      additionalProperties: false
      required: [devKey, serverId]
      properties:
        devKey:
          type: string
          minLength: 1
          maxLength: 32
          pattern: '^[a-zA-Z0-9_-]+$'
        serverId:
          type: integer
          minimum: 0
          maximum: 65535
        deviceId:
          type:
            - string
            - 'null'
          maxLength: 64
    LoginResponse:
      type: object
      additionalProperties: false
      required: [userId, accessToken, isNewAccount]
      properties:
        userId:
          type: string
        accessToken:
          type: string
        isNewAccount:
          type: boolean
    AreaServer:
      type: object
      additionalProperties: false
      required: [serverId, name, tag, status, openTime, gameHttpUrl, gameWsUrl]
      properties:
        serverId:
          type: integer
          minimum: 0
          maximum: 65535
        name:
          type: string
          minLength: 1
          maxLength: 64
        tag:
          type: string
          enum: [normal, new, full, maintenance]
        status:
          type: string
          enum: [smooth, busy, maintenance]
        openTime:
          type: integer
          minimum: 0
        gameHttpUrl:
          type: string
        gameWsUrl:
          type: string
    AreaListResponse:
      type: object
      additionalProperties: false
      required: [isOps, hash, servers, myServerIds]
      properties:
        isOps:
          type: boolean
        hash:
          type: string
        servers:
          type: array
          items:
            $ref: '#/components/schemas/AreaServer'
        myServerIds:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 65535
    VerifySessionRequest:
      type: object
      additionalProperties: false
      required: [accessToken, serverId]
      properties:
        accessToken:
          type: string
          minLength: 1
          maxLength: 256
        serverId:
          type: integer
          minimum: 0
          maximum: 65535
    VerifySessionResponse:
      oneOf:
        - type: object
          additionalProperties: false
          required: [valid, userId, issuedAtMs]
          properties:
            valid:
              const: true
            userId:
              type: string
            issuedAtMs:
              type: integer
              minimum: 0
        - type: object
          additionalProperties: false
          required: [valid, reason]
          properties:
            valid:
              const: false
            reason:
              type: string
              enum: [NOT_FOUND, MISMATCH, BANNED, DEREGISTERED, EXPIRED]
    RegisterCharacterResponse:
      type: object
      additionalProperties: false
      required: [registered]
      properties:
        registered:
          const: true
    HasCharacterResponse:
      type: object
      additionalProperties: false
      required: [exists]
      properties:
        exists:
          type: boolean
    AdminAccountRequest:
      type: object
      additionalProperties: false
      required: [operationId, reason]
      properties:
        operationId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-zA-Z0-9_.:-]+$'
        reason:
          type: string
          minLength: 1
          maxLength: 255
    AdminLoginRequest:
      type: object
      additionalProperties: false
      required: [operatorId, password]
      properties:
        operatorId:
          type: string
          maxLength: 64
        password:
          type: string
          maxLength: 1024
    AdminOperator:
      type: object
      additionalProperties: false
      required: [operatorId, displayName]
      properties:
        operatorId:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[a-z][a-z0-9_.-]{2,63}$'
        displayName:
          type: string
          minLength: 1
          maxLength: 128
    AdminGameAccess:
      type: object
      additionalProperties: false
      required: [gameId, name, status, canOperateAccounts]
      properties:
        gameId:
          $ref: '#/components/schemas/GameId'
        name:
          type: string
          minLength: 1
          maxLength: 128
        status:
          $ref: '#/components/schemas/GameStatus'
        canOperateAccounts:
          type: boolean
    AdminSessionResponse:
      type: object
      additionalProperties: false
      required: [operator, games, expiresAt]
      properties:
        operator:
          $ref: '#/components/schemas/AdminOperator'
        games:
          type: array
          maxItems: 1024
          items:
            $ref: '#/components/schemas/AdminGameAccess'
        expiresAt:
          type: string
          format: date-time
    AdminAccountDetailResponse:
      type: object
      additionalProperties: false
      required: [userId, status, lastLoginAt, activeSessionCount]
      properties:
        userId:
          type: string
          minLength: 1
          maxLength: 32
          pattern: '^u_[0-9]+$'
        status:
          type: string
          enum: [active, banned, deregistered]
        lastLoginAt:
          type:
            - string
            - 'null'
          format: date-time
        activeSessionCount:
          type: integer
          minimum: 0
    AdminAccountResponse:
      type: object
      additionalProperties: false
      required: [accountExists, status]
      properties:
        accountExists:
          type: boolean
        status:
          type: string
          enum: [banned, revoked, not_found]
    LiveResponse:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          const: true
    ReadyResponse:
      type: object
      additionalProperties: false
      required: [ready]
      properties:
        ready:
          type: boolean
    VersionResponse:
      type: object
      additionalProperties: false
      required: [service, serviceVersion, contractVersion, schemaVersion, gitSha]
      properties:
        service:
          const: game-manage-kit
        serviceVersion:
          type: string
        contractVersion:
          type: string
        schemaVersion:
          type: integer
        gitSha:
          type: string
