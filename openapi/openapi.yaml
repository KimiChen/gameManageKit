components:
  securitySchemes:
    UserBearer:
      type: http
      scheme: bearer
    ServiceId:
      type: apiKey
      in: header
      name: x-service-id
    ServiceSecret:
      type: apiKey
      in: header
      name: x-service-secret
    AdminSecret:
      type: apiKey
      in: header
      name: x-admin-secret
    OperatorId:
      type: apiKey
      in: header
      name: x-operator-id
    AdminSession:
      type: apiKey
      in: cookie
      name: __Host-gmk_admin_session
  parameters:
    GameId:
      name: gameId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/GameId'
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 32
        pattern: '^u_[0-9]+$'
    ServerId:
      name: serverId
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
        maximum: 65535
    IdentityId:
      name: identityId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/MachineIdentityId'
    SecretVersion:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OperationId'
    AuditGameId:
      name: gameId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/GameId'
    AuditLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  responses:
    BadRequest:
      description: 入参不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 用户身份无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnauthorized:
      description: 服务身份无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AdminUnauthorized:
      description: 管理员凭证或会话无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 禁止访问；可能为账号封禁、游戏停用、调用方无游戏权限或区服停用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源、游戏或区服不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 操作冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: 请求过频
      headers:
        Retry-After:
          description: 建议等待的秒数
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Internal:
      description: 内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unavailable:
      description: 微信上游不可用，或游戏处于维护状态
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    GameId:
      type: string
      minLength: 2
      maxLength: 32
      pattern: '^[a-z][a-z0-9-]{1,31}$'
    OperationId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-zA-Z0-9_.:-]+$'
    MachineIdentityId:
      type: string
      minLength: 3
      maxLength: 64
      pattern: '^[a-z][a-z0-9_.-]{2,63}$'
    GameStatus:
      type: string
      enum: [enabled, maintenance, disabled]
    GameConfigurationState:
      type: string
      enum: [draft, configured]
    ErrorCode:
      type: string
      enum:
        - INVALID_PAYLOAD
        - AUTH_REQUIRED
        - ACCOUNT_BANNED
        - NOT_FOUND
        - RATE_LIMITED
        - UPSTREAM_UNAVAILABLE
        - SERVICE_AUTH_REQUIRED
        - SERVICE_FORBIDDEN
        - OPERATION_CONFLICT
        - INTERNAL
        - GAME_NOT_FOUND
        - GAME_DISABLED
        - GAME_ACCESS_DENIED
        - SERVER_NOT_FOUND
        - SERVER_DISABLED
        - ADMIN_AUTH_REQUIRED
        - ORIGIN_FORBIDDEN
        - GAME_PROJECT_CONFLICT
        - GAME_SERVER_CONFLICT
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, requestId]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        requestId:
          type: string
    WxLoginRequest:
      type: object
      additionalProperties: false
      required: [code, serverId]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 128
        serverId:
          type: integer
          minimum: 0
          maximum: 65535
        deviceId:
          type:
            - string
            - 'null'
          maxLength: 64
    DevLoginRequest:
      type: object
      additionalProperties: false
      required: [devKey, serverId]
      properties:
        devKey:
          type: string
          minLength: 1
          maxLength: 32
          pattern: '^[a-zA-Z0-9_-]+$'
        serverId:
          type: integer
          minimum: 0
          maximum: 65535
        deviceId:
          type:
            - string
            - 'null'
          maxLength: 64
    LoginResponse:
      type: object
      additionalProperties: false
      required: [userId, accessToken, isNewAccount]
      properties:
        userId:
          type: string
        accessToken:
          type: string
        isNewAccount:
          type: boolean
    AreaServer:
      type: object
      additionalProperties: false
      required: [serverId, name, tag, status, openTime, gameHttpUrl, gameWsUrl]
      properties:
        serverId:
          type: integer
          minimum: 0
          maximum: 65535
        name:
          type: string
          minLength: 1
          maxLength: 64
        tag:
          type: string
          enum: [normal, new, full, maintenance]
        status:
          type: string
          enum: [smooth, busy, maintenance]
        openTime:
          type: integer
          minimum: 0
        gameHttpUrl:
          type: string
        gameWsUrl:
          type: string
    AreaListResponse:
      type: object
      additionalProperties: false
      required: [isOps, hash, servers, myServerIds]
      properties:
        isOps:
          type: boolean
        hash:
          type: string
        servers:
          type: array
          items:
            $ref: '#/components/schemas/AreaServer'
        myServerIds:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 65535
    VerifySessionRequest:
      type: object
      additionalProperties: false
      required: [accessToken, serverId]
      properties:
        accessToken:
          type: string
          minLength: 1
          maxLength: 256
        serverId:
          type: integer
          minimum: 0
          maximum: 65535
    VerifySessionResponse:
      oneOf:
        - type: object
          additionalProperties: false
          required: [valid, userId, issuedAtMs]
          properties:
            valid:
              const: true
            userId:
              type: string
            issuedAtMs:
              type: integer
              minimum: 0
        - type: object
          additionalProperties: false
          required: [valid, reason]
          properties:
            valid:
              const: false
            reason:
              type: string
              enum: [NOT_FOUND, MISMATCH, BANNED, DEREGISTERED, EXPIRED]
    RegisterCharacterResponse:
      type: object
      additionalProperties: false
      required: [registered]
      properties:
        registered:
          const: true
    HasCharacterResponse:
      type: object
      additionalProperties: false
      required: [exists]
      properties:
        exists:
          type: boolean
    AdminAccountRequest:
      type: object
      additionalProperties: false
      required: [operationId, reason]
      properties:
        operationId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-zA-Z0-9_.:-]+$'
        reason:
          type: string
          minLength: 1
          maxLength: 255
    AdminLoginRequest:
      type: object
      additionalProperties: false
      required: [operatorId, password]
      properties:
        operatorId:
          type: string
          maxLength: 64
        password:
          type: string
          maxLength: 1024
          writeOnly: true
    AdminReauthenticateRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          maxLength: 1024
          writeOnly: true
    AdminOperator:
      type: object
      additionalProperties: false
      required: [operatorId, displayName]
      properties:
        operatorId:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[a-z][a-z0-9_.-]{2,63}$'
        displayName:
          type: string
          minLength: 1
          maxLength: 128
    AdminGameAccess:
      type: object
      additionalProperties: false
      required: [gameId, name, status, canOperateAccounts]
      properties:
        gameId:
          $ref: '#/components/schemas/GameId'
        name:
          type: string
          minLength: 1
          maxLength: 128
        status:
          $ref: '#/components/schemas/GameStatus'
        canOperateAccounts:
          type: boolean
    AdminSessionResponse:
      type: object
      additionalProperties: false
      required:
        - operator
        - games
        - canManageGames
        - canManageIntegrations
        - canRotateSecrets
        - canManageMachineIdentities
        - expiresAt
        - elevatedUntil
      properties:
        operator:
          $ref: '#/components/schemas/AdminOperator'
        games:
          type: array
          items:
            $ref: '#/components/schemas/AdminGameAccess'
        canManageGames:
          type: boolean
        canManageIntegrations:
          type: boolean
        canRotateSecrets:
          type: boolean
        canManageMachineIdentities:
          type: boolean
        expiresAt:
          type: string
          format: date-time
        elevatedUntil:
          type:
            - string
            - 'null'
          format: date-time
    GameProject:
      type: object
      additionalProperties: false
      required:
        - gameId
        - name
        - description
        - status
        - configurationState
        - clientVisible
        - sortOrder
        - revision
        - createdAt
        - updatedAt
      properties:
        gameId:
          $ref: '#/components/schemas/GameId'
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 500
        status:
          $ref: '#/components/schemas/GameStatus'
        configurationState:
          $ref: '#/components/schemas/GameConfigurationState'
        clientVisible:
          type: boolean
        sortOrder:
          type: integer
          minimum: 0
          maximum: 65535
        revision:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GameProjectListResponse:
      type: object
      additionalProperties: false
      required: [games]
      properties:
        games:
          type: array
          items:
            $ref: '#/components/schemas/GameProject'
    CreateGameProjectRequest:
      type: object
      additionalProperties: false
      required: [gameId, name, description]
      properties:
        gameId:
          $ref: '#/components/schemas/GameId'
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 500
    UpdateGameProjectRequest:
      type: object
      additionalProperties: false
      required: [name, description, status, clientVisible, sortOrder, revision]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 500
        status:
          $ref: '#/components/schemas/GameStatus'
        clientVisible:
          type: boolean
        sortOrder:
          type: integer
          minimum: 0
          maximum: 65535
        revision:
          type: integer
          minimum: 1
    GameDirectorySettings:
      type: object
      additionalProperties: false
      required: [gameId, isOps, revision, createdAt, updatedAt]
      properties:
        gameId:
          $ref: '#/components/schemas/GameId'
        isOps:
          type: boolean
        revision:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UpdateGameDirectorySettingsRequest:
      type: object
      additionalProperties: false
      required: [isOps, revision]
      properties:
        isOps:
          type: boolean
        revision:
          type: integer
          minimum: 1
    ManagedGameServer:
      type: object
      additionalProperties: false
      required:
        - gameId
        - serverId
        - name
        - tag
        - status
        - openTime
        - gameHttpUrl
        - gameWsUrl
        - isOpen
        - sortOrder
        - revision
        - createdAt
        - updatedAt
      properties:
        gameId:
          $ref: '#/components/schemas/GameId'
        serverId:
          type: integer
          minimum: 0
          maximum: 65535
        name:
          type: string
          minLength: 1
          maxLength: 64
        tag:
          type: string
          enum: [normal, new, full, maintenance]
        status:
          type: string
          enum: [smooth, busy, maintenance]
        openTime:
          type: integer
          minimum: 0
        gameHttpUrl:
          type: string
          format: uri
          maxLength: 2048
        gameWsUrl:
          type: string
          format: uri
          maxLength: 2048
        isOpen:
          type: boolean
        sortOrder:
          type: integer
          minimum: 0
          maximum: 65535
        revision:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ManagedGameServerListResponse:
      type: object
      additionalProperties: false
      required: [directoryRevision, servers]
      properties:
        directoryRevision:
          type: integer
          minimum: 1
        servers:
          type: array
          maxItems: 65536
          items:
            $ref: '#/components/schemas/ManagedGameServer'
    ManagedGameServerMutationResponse:
      type: object
      additionalProperties: false
      required: [directoryRevision, server]
      properties:
        directoryRevision:
          type: integer
          minimum: 1
        server:
          $ref: '#/components/schemas/ManagedGameServer'
    CreateGameServerRequest:
      type: object
      additionalProperties: false
      required:
        - directoryRevision
        - serverId
        - name
        - tag
        - status
        - openTime
        - gameHttpUrl
        - gameWsUrl
        - isOpen
        - sortOrder
      properties:
        directoryRevision:
          type: integer
          minimum: 1
        serverId:
          type: integer
          minimum: 0
          maximum: 65535
        name:
          type: string
          minLength: 1
          maxLength: 64
        tag:
          type: string
          enum: [normal, new, full, maintenance]
        status:
          type: string
          enum: [smooth, busy, maintenance]
        openTime:
          type: integer
          minimum: 0
        gameHttpUrl:
          type: string
          format: uri
          maxLength: 2048
        gameWsUrl:
          type: string
          format: uri
          maxLength: 2048
        isOpen:
          type: boolean
        sortOrder:
          type: integer
          minimum: 0
          maximum: 65535
    UpdateGameServerRequest:
      type: object
      additionalProperties: false
      required:
        - directoryRevision
        - name
        - tag
        - status
        - openTime
        - gameHttpUrl
        - gameWsUrl
        - isOpen
        - sortOrder
        - revision
